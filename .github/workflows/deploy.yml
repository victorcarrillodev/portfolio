name: Deploy Portfolio

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      # 1. Forzar Node.js a la versión 22 (necesario para Astro 6+)
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 2. Instalar Bun
      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # 3. Ahora el build no fallará por versión de Node
      - name: Instalar dependencias y hacer Build
        run: |
          bun install
          bun run build

      - name: Conectar a la red de Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Desplegar archivos al servidor
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: 'dist/*'
          target: '/var/www/html/portfolio'
          strip_components: 1
          overwrite: true
